<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alcance Penal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <div class="brand">
      <img src="assets/logo.png" alt="Alcance Penal" class="logo" />
      <p class="subtitle">Analizador</p>
    </div>

    <form id="input-form" class="form">
      <textarea
        id="input-text"
        class="input-field"
        placeholder="Pega un texto o una URL..."
        rows="6"
        required
      ></textarea>

      <button type="submit" id="submit-btn" class="submit-btn">Enviar</button>
    </form>

    <div id="loading" class="loading hidden">
      <span class="loading-text">Procesando</span>
      <span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>

    <div id="output" class="output hidden">
      <div class="output-label">Artículo</div>
      <p id="output-text" class="output-text"></p>
      <p id="aviso-text" class="aviso-text hidden"></p>
    </div>

    <div id="edit-prompt" class="edit-prompt hidden">
      <p class="edit-question">¿Quieres editar algo?</p>
      <div class="edit-actions">
        <button type="button" id="edit-yes-btn" class="secondary-btn">Sí, editar</button>
        <button type="button" id="edit-no-btn" class="secondary-btn">No, listo</button>
      </div>
    </div>

    <form id="edit-form" class="form hidden">
      <textarea
        id="edit-text"
        class="input-field"
        placeholder="¿Qué quieres cambiar?"
        rows="3"
        required
      ></textarea>
      <button type="submit" id="edit-submit-btn" class="submit-btn">Aplicar cambio</button>
    </form>

    <div id="done" class="done hidden">Listo. Puedes pegar otro texto o URL cuando quieras.</div>

    <div id="error" class="error hidden"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
